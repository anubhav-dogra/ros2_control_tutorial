controller_manager:
  ros__parameters:
    update_rate: 100  # Control loop frequency

    # Correct placement of controller types
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    forward_position_controller:
      type: forward_command_controller/ForwardCommandController

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# Now defining parameters for controllers separately
forward_position_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2  # Make sure joint names match your URDF
    interface_name: position

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2  # Ensure joint names match URDF

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0
    action_monitor_rate: 20.0

    allow_partial_joints_goals: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
